name: Probe v9 Settings and Channels

on:
  workflow_dispatch:
  push:
    branches: [projectivy-v9-profile-multiselect-fix]
    paths:
      - '.github/workflows/probe-v9-settings-channels.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Decompile Projectivy 4.72
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/projectivy.apk
          curl -fL --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          rm -rf /tmp/jadx-out /tmp/apk-out /tmp/probe
          mkdir -p /tmp/probe/src /tmp/probe/smali-refs
          /tmp/jadx/bin/jadx --no-res --show-bad-code -d /tmp/jadx-out /tmp/projectivy.apk >/tmp/probe/jadx.log 2>&1 || true
          java -jar /tmp/apktool.jar d -f /tmp/projectivy.apk -o /tmp/apk-out >/tmp/probe/apktool.log 2>&1
          grep -RilE 'plbackup|ImportSettings|ExportSettings|action_categories_list|appearance_cards_bg|appearance.*icon|MultiSelectListPreference|ListPreference' /tmp/jadx-out/sources | head -n 250 > /tmp/probe/hit-files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            rel="${f#/tmp/jadx-out/sources/}"
            mkdir -p "/tmp/probe/src/$(dirname "$rel")"
            cp "$f" "/tmp/probe/src/$rel"
          done < /tmp/probe/hit-files.txt
          grep -RniE 'plbackup|ImportSettings|ExportSettings|action_categories_list|appearance_cards_bg|appearance.*icon|MultiSelectListPreference|ListPreference|setValue|setValues' /tmp/probe/src > /tmp/probe/hits.txt || true
          grep -Rl 'Lhj3;->s:L' /tmp/apk-out/smali* > /tmp/probe/hj3-s-smali-files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            cp "$f" "/tmp/probe/smali-refs/$(basename $(dirname "$f"))-$(basename "$f")"
          done < /tmp/probe/hj3-s-smali-files.txt
          for cls in g70 k00 b40 w40 yh3 dj3 s71 e70 i5 ft f70 f6 ie2 he2 xi3 v hj3 bs4 au4 t40 u40; do
            f="/tmp/jadx-out/sources/defpackage/${cls}.java"
            [ -f "$f" ] && cp "$f" "/tmp/probe/${cls}.java"
            find /tmp/apk-out -name "${cls}.smali" -print -exec cp '{}' "/tmp/probe/${cls}.smali" \; | head -1 || true
          done
          for f in ImportSettingsActivity ImportThemeActivity; do
            src="/tmp/jadx-out/sources/com/spocky/projengmenu/ui/launcherActivities/${f}.java"
            [ -f "$src" ] && cp "$src" "/tmp/probe/${f}.java"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: v9-settings-channels-probe
          path: /tmp/probe
          retention-days: 7
