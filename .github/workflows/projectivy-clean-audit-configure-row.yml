name: Projectivy Clean Audit - Configure Row
on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-audit-configure-row.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Trace y05.s row creation
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/official.apk
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/official.apk -o /tmp/pj >/dev/null
          mkdir -p /tmp/audit
          grep -R -n -B100 -A180 --include='*.smali' 'Ly05;->s()Z' /tmp/pj/smali* > /tmp/audit/configure-row-callers.txt || true
          grep -R -n -B80 -A140 --include='*.smali' 'const-wide/16 .*0x64' /tmp/pj/smali_classes2/ze.smali > /tmp/audit/action100-context.txt || true
          cat /tmp/audit/configure-row-callers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-Configure-Row-Audit
          path: /tmp/audit/*
          retention-days: 7
