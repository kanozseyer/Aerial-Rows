name: Phase 6 Final Trigger

on:
  push:
    paths:
      - '.github/phase6-final-trigger'

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/phase6-final-settings'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-final-settings
          fetch-depth: 0
      - name: Materialize final Phase 6 settings changes
        run: python3 .github/phase6_patch.py
      - name: Run cheap Phase 6 gate
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace
      - name: Commit materialized changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Finish Phase 6 dynamic settings and config transfer"
            git push origin HEAD:phase6-final-settings
          fi
