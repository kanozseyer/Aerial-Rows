name: Projectivy CLEAN 13.1L - Weather Routing Fix

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean13-1l-weather-routing-fix]
    paths:
      - '.github/clean13_1l/**'
      - '.github/workflows/projectivy-clean-13-1l-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build CLEAN13.1L
        shell: bash
        run: bash .github/clean13_1l/build-clean13-1l.sh
      - name: Upload CLEAN13.1L artifact
        uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-13-1L-Weather-Routing-Fix
          path: /tmp/clean13-1l-artifact
          retention-days: 90
