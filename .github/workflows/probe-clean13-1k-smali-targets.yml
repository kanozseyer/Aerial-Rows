name: Probe CLEAN13.1K Smali Targets

on:
  push:
    branches: [projectivy-clean13-1k-weather-choice-mono-icons]
    paths:
      - '.github/workflows/probe-clean13-1k-smali-targets.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode target smali only
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/p.apk
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -r -f /tmp/p.apk -o /tmp/pj >/dev/null
          {
            for n in bi3 IconHeaderImageView gv pq0; do
              f="$(find /tmp/pj -name "$n.smali" -print -quit)"
              echo "===== $n :: $f ====="
              test -n "$f"
              cat "$f"
            done
          } > /tmp/targets.txt
          cat /tmp/targets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clean13-1k-smali-targets
          path: /tmp/targets.txt
          retention-days: 7
