name: Phase 6 Final Materializer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/phase6-final-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/phase6-final-settings'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-final-settings
          fetch-depth: 0
      - name: Materialize final Phase 6 settings changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing patch anchor: {label}')
              return text.replace(old, new, 1)

          p = Path('app/src/main/java/com/conreo/couchytv/ui/SettingsSheet.kt')
          s = p.read_text()
          s = s.replace('import com.conreo.couchytv.core.settings.DisplaySettingDescriptors\n', 'import com.conreo.couchytv.core.settings.AppSettingsIds\nimport com.conreo.couchytv.core.settings.CategorySettingsIds\nimport com.conreo.couchytv.core.settings.DisplaySettingDescriptors\n')
          s = s.replace('import com.conreo.couchytv.data.ConfigStore\n', 'import com.conreo.couchytv.data.ConfigDefaults\nimport com.conreo.couchytv.data.ConfigImportResult\nimport com.conreo.couchytv.data.ConfigStore\nimport com.conreo.couchytv.data.ConfigTransfer\n')
          s = s.replace('import java.io.File\nimport kotlinx.serialization.json.Json\n\nprivate val format = Json { ignoreUnknownKeys = true; prettyPrint = true; encodeDefaults = true }\n', 'import java.io.File\n')

          s = replace_once(s, '''                    SettingsRoutes.Apps -> AppsScreen(
                        apps = apps,
                        config = config,
                        onBack = { navigation = navigation.back() },
''', '''                    SettingsRoutes.Apps -> AppsScreen(
                        apps = apps,
                        config = config,
                        rememberedFocus = navigation.rememberedFocus(SettingsRoutes.Apps),
                        onFocus = { id -> navigation = navigation.rememberFocus(SettingsRoutes.Apps, id) },
                        onBack = { navigation = navigation.back() },
''', 'apps route focus')
          s = replace_once(s, '''                    SettingsRoutes.Channels -> ChannelsSettingsScreen(
                        config = config,
                        store = store,
                    )
''', '''                    SettingsRoutes.Channels -> ChannelsSettingsScreen(
                        config = config,
                        store = store,
                        rememberedFocus = navigation.rememberedFocus(SettingsRoutes.Channels),
                        onFocus = { id -> navigation = navigation.rememberFocus(SettingsRoutes.Channels, id) },
                    )
''', 'channels route focus')
          s = replace_once(s, '''                    SettingsRoutes.Categories -> CategoriesScreen(
                        config = config,
                        apps = apps,
                        store = store,
                        onBack = { navigation = navigation.back() },
                    )
''', '''                    SettingsRoutes.Categories -> CategoriesScreen(
                        config = config,
                        apps = apps,
                        store = store,
                        rememberedFocus = navigation.rememberedFocus(SettingsRoutes.Categories),
                        onFocus = { id -> navigation = navigation.rememberFocus(SettingsRoutes.Categories, id) },
                        onBack = { navigation = navigation.back() },
                    )
''', 'categories route focus')

          s = replace_once(s, '''private fun AppsScreen(
    apps: List<AppEntry>,
    config: LauncherConfig,
    onBack: () -> Unit,
''', '''private fun AppsScreen(
    apps: List<AppEntry>,
    config: LauncherConfig,
    rememberedFocus: SettingId?,
    onFocus: (SettingId) -> Unit,
    onBack: () -> Unit,
''', 'apps signature')
          s = replace_once(s, '''    val catNames = remember(config.categories) { config.categories.associate { it.id to it.name } }

    Column(Modifier.fillMaxSize().padding(20.dp)) {
''', '''    val catNames = remember(config.categories) { config.categories.associate { it.id to it.name } }
    val appFocusIds = remember(apps) { apps.map { AppSettingsIds.app(it.pkg, it.componentName) } }
    val appFocus = appFocusIds.takeIf { it.isNotEmpty() }?.let { ids ->
        rememberSettingsFocusBindings(
            ids = ids,
            rememberedFocus = rememberedFocus,
            defaultFocus = ids.first(),
            onFocused = onFocus,
        )
    }

    Column(Modifier.fillMaxSize().padding(20.dp)) {
''', 'apps bindings')
          s = s.replace('''        val f = initialFocus()
        LazyColumn(
''', '''        LazyColumn(
''', 1)
          s = replace_once(s, '''                            modifier = if (i == 0) Modifier.focusRequester(f) else Modifier,
''', '''                            modifier = appFocus?.modifier(AppSettingsIds.app(app.pkg, app.componentName)) ?: Modifier,
''', 'apps row modifier')

          old_launcher = '''    fun saveConfig() {
        scope.launch {
            withContext(Dispatchers.IO) {
                runCatching {
                    val dir = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS)
                    dir.mkdirs()
                    File(dir, "CouchyBackup.json").writeText(format.encodeToString(LauncherConfig.serializer(), config))
                }
            }
            Actions.toast(context, "Saved to Downloads/CouchyBackup.json")
        }
    }

    val focus = rememberSettingsFocusBindings(
'''
          new_launcher = '''    val savePicker = rememberLauncherForActivityResult(
        ActivityResultContracts.CreateDocument("application/json")
    ) { uri ->
        if (uri != null) {
            scope.launch {
                val saved = withContext(Dispatchers.IO) {
                    runCatching {
                        context.contentResolver.openOutputStream(uri, "wt")?.bufferedWriter()?.use { writer ->
                            writer.write(ConfigTransfer.encode(config))
                        } ?: error("Could not open destination")
                    }.isSuccess
                }
                Actions.toast(
                    context,
                    context.getString(if (saved) R.string.toast_config_saved else R.string.toast_config_save_failed),
                )
            }
        }
    }

    val focus = rememberSettingsFocusBindings(
'''
          s = replace_once(s, old_launcher, new_launcher, 'save picker')
          old_load = '''                val loaded = withContext(Dispatchers.IO) {
                    runCatching {
                        context.contentResolver.openInputStream(uri)?.use { input ->
                            format.decodeFromString(LauncherConfig.serializer(), String(input.readBytes()))
                        }
                    }.getOrNull()
                }
                if (loaded != null) {
                    store.update { loaded.copy(knownApps = config.knownApps, setupDone = true) }
                    Actions.toast(context, context.getString(R.string.toast_config_loaded))
                } else {
                    Actions.toast(context, context.getString(R.string.toast_config_bad))
                }
'''
          new_load = '''                val imported = withContext(Dispatchers.IO) {
                    runCatching {
                        val raw = context.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() }
                            ?: return@runCatching ConfigImportResult.Invalid
                        ConfigTransfer.decodeForRestore(
                            raw = raw,
                            fallbackCategories = ConfigDefaults.defaultCategories(context),
                            knownApps = config.knownApps,
                        )
                    }.getOrDefault(ConfigImportResult.Invalid)
                }
                when (imported) {
                    is ConfigImportResult.Success -> {
                        store.update { imported.config }
                        Actions.toast(context, context.getString(R.string.toast_config_loaded))
                    }
                    is ConfigImportResult.UnsupportedSchema ->
                        Actions.toast(context, context.getString(R.string.toast_config_newer))
                    ConfigImportResult.Invalid ->
                        Actions.toast(context, context.getString(R.string.toast_config_bad))
                }
'''
          s = replace_once(s, old_load, new_load, 'safe load')
          s = replace_once(s, '''            onClick = { saveConfig() },
''', '''            onClick = {
                runCatching { savePicker.launch("AerialRowsConfig.json") }
                    .onFailure { Actions.toast(context, context.getString(R.string.toast_no_picker)) }
            },
''', 'save row')

          s = replace_once(s, '''private fun CategoriesScreen(
    config: LauncherConfig,
    apps: List<AppEntry>,
    store: ConfigStore,
    onBack: () -> Unit,
''', '''private fun CategoriesScreen(
    config: LauncherConfig,
    apps: List<AppEntry>,
    store: ConfigStore,
    rememberedFocus: SettingId?,
    onFocus: (SettingId) -> Unit,
    onBack: () -> Unit,
''', 'categories signature')
          s = replace_once(s, '''    var renameFor by remember { mutableStateOf<CategoryCfg?>(null) }
    var appsFor by remember { mutableStateOf<CategoryCfg?>(null) }

    Column(
''', '''    var renameFor by remember { mutableStateOf<CategoryCfg?>(null) }
    var appsFor by remember { mutableStateOf<CategoryCfg?>(null) }
    val categoryFocusIds = remember(config.categories) {
        buildList {
            add(CategorySettingsIds.AllApps)
            config.categories.filter { it.id != AppRepository.ALL_APPS_ID }
                .forEach { add(CategorySettingsIds.category(it.id)) }
            add(CategorySettingsIds.AddCategory)
        }
    }
    val categoryFocus = rememberSettingsFocusBindings(
        ids = categoryFocusIds,
        rememberedFocus = rememberedFocus,
        defaultFocus = CategorySettingsIds.AllApps,
        onFocused = onFocus,
    )

    Column(
''', 'categories bindings')
          s = s.replace('''        val f = initialFocus()
        // Auto-filled "All apps" section''', '''        // Auto-filled "All apps" section''', 1)
          s = replace_once(s, '''                modifier = Modifier.focusRequester(f),
                headlineContent = { Text(allName) },
''', '''                modifier = categoryFocus.modifier(CategorySettingsIds.AllApps),
                headlineContent = { Text(allName) },
''', 'all apps focus')
          s = replace_once(s, '''                        onClick = { appsFor = cat },
                        headlineContent = { Text(cat.name) },
''', '''                        onClick = { appsFor = cat },
                        modifier = categoryFocus.modifier(CategorySettingsIds.category(cat.id)),
                        headlineContent = { Text(cat.name) },
''', 'category focus')
          s = replace_once(s, '''            headlineContent = { Text(stringResource(R.string.add_section)) },
            leadingContent = { Icon(AppIcons.Add, contentDescription = null) },
''', '''            modifier = categoryFocus.modifier(CategorySettingsIds.AddCategory),
            headlineContent = { Text(stringResource(R.string.add_section)) },
            leadingContent = { Icon(AppIcons.Add, contentDescription = null) },
''', 'add category focus')
          p.write_text(s)

          p = Path('app/src/main/java/com/conreo/couchytv/ui/AerialSettingsExtras.kt')
          s = p.read_text()
          s = s.replace('import com.conreo.couchytv.core.settings.DisplaySettingDescriptors\n', 'import com.conreo.couchytv.core.settings.ChannelSettingsIds\nimport com.conreo.couchytv.core.settings.DisplaySettingDescriptors\nimport com.conreo.couchytv.core.settings.SettingId\n')
          s = replace_once(s, '''fun ChannelsSettingsScreen(
    config: LauncherConfig,
    store: ConfigStore,
) {
''', '''fun ChannelsSettingsScreen(
    config: LauncherConfig,
    store: ConfigStore,
    rememberedFocus: SettingId?,
    onFocus: (SettingId) -> Unit,
) {
''', 'channels signature')
          s = replace_once(s, '''    val watchNextProviders by produceState(emptyList<com.conreo.couchytv.data.TvProviderInfo>(), channelRefresh) {
        value = TvContentRepository.discoverWatchNextProviders(context)
    }

    Column(
''', '''    val watchNextProviders by produceState(emptyList<com.conreo.couchytv.data.TvProviderInfo>(), channelRefresh) {
        value = TvContentRepository.discoverWatchNextProviders(context)
    }
    val channelFocusIds = remember(
        config.showWatchNext,
        config.showPreviewChannels,
        watchNextProviders,
        channels,
    ) {
        buildList {
            add(ChannelSettingsIds.WatchNext)
            if (config.showWatchNext) {
                add(ChannelSettingsIds.WatchNextLimit)
                watchNextProviders.forEach { add(ChannelSettingsIds.watchNextProvider(it.packageName)) }
            }
            add(ChannelSettingsIds.PreviewChannels)
            add(ChannelSettingsIds.DefaultChannelLimit)
            channels.forEach { channel ->
                add(ChannelSettingsIds.channel(channel.key))
                if (channel.browsable && channel.programs.isNotEmpty()) {
                    add(ChannelSettingsIds.channelLimit(channel.key))
                }
            }
        }
    }
    val channelFocus = rememberSettingsFocusBindings(
        ids = channelFocusIds,
        rememberedFocus = rememberedFocus,
        defaultFocus = ChannelSettingsIds.WatchNext,
        onFocused = onFocus,
    )

    Column(
''', 'channels bindings')
          s = s.replace('''        val focus = extraInitialFocus()
        ExtraSettingRow(
''', '''        ExtraSettingRow(
''', 1)
          s = replace_once(s, '''            modifier = Modifier.focusRequester(focus),
            onClick = {
''', '''            modifier = channelFocus.modifier(ChannelSettingsIds.WatchNext),
            onClick = {
''', 'watch next focus')
          s = replace_once(s, '''                current = capIndex,
                onSelect = { i ->
''', '''                current = capIndex,
                modifier = channelFocus.modifier(ChannelSettingsIds.WatchNextLimit),
                onSelect = { i ->
''', 'watch next limit focus')
          s = replace_once(s, '''                        checked = enabled,
                        onClick = {
''', '''                        checked = enabled,
                        modifier = channelFocus.modifier(ChannelSettingsIds.watchNextProvider(provider.packageName)),
                        onClick = {
''', 'provider focus')
          s = replace_once(s, '''            checked = config.showPreviewChannels,
            onClick = {
''', '''            checked = config.showPreviewChannels,
            modifier = channelFocus.modifier(ChannelSettingsIds.PreviewChannels),
            onClick = {
''', 'preview focus')
          s = replace_once(s, '''            steps = limits.size,
            current = current,
            onSelect = { i -> scope.launch { store.update { it.copy(channelItemLimit = limits[i]) } } },
''', '''            steps = limits.size,
            current = current,
            modifier = channelFocus.modifier(ChannelSettingsIds.DefaultChannelLimit),
            onSelect = { i -> scope.launch { store.update { it.copy(channelItemLimit = limits[i]) } } },
''', 'default channel limit focus')
          s = replace_once(s, '''                    checked = channel.browsable && !hidden,
                    onClick = {
''', '''                    checked = channel.browsable && !hidden,
                    modifier = channelFocus.modifier(ChannelSettingsIds.channel(channel.key)),
                    onClick = {
''', 'channel focus')
          s = replace_once(s, '''                        steps = limits.size,
                        current = index,
                        onSelect = { i ->
''', '''                        steps = limits.size,
                        current = index,
                        modifier = channelFocus.modifier(ChannelSettingsIds.channelLimit(channel.key)),
                        onSelect = { i ->
''', 'channel limit focus')
          p.write_text(s)

          p = Path('app/src/main/java/com/conreo/couchytv/core/settings/SettingsDescriptors.kt')
          s = p.read_text()
          s = s.replace('''        SettingEffect.RELOAD_WALLPAPER,
''', '''        SettingEffect.RECOMPOSE,
''')
          p.write_text(s)

          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text()
          s = replace_once(s, '''    <string name="toast_config_saved">Configuration saved</string>
    <string name="toast_config_loaded">Configuration loaded — restart may be needed</string>
    <string name="toast_config_bad">Invalid or corrupted backup file</string>
''', '''    <string name="toast_config_saved">Configuration saved</string>
    <string name="toast_config_save_failed">Could not save configuration</string>
    <string name="toast_config_loaded">Configuration loaded</string>
    <string name="toast_config_bad">Invalid or corrupted backup file</string>
    <string name="toast_config_newer">This configuration was created by a newer version</string>
''', 'config toast strings')
          p.write_text(s)
      - name: Run cheap Phase 6 gate
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace
      - name: Commit materialized changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Finish Phase 6 dynamic settings and config transfer"
            git push origin HEAD:phase6-final-settings
          fi
