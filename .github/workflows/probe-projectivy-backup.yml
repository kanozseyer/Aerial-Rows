name: Probe Projectivy Backup

on:
  push:
    branches: [projectivy-native-mod]
    paths:
      - '.github/workflows/probe-projectivy-backup.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Projectivy and JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/projectivy.apk
          curl -fL --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
      - name: Decompile backup crypto and channel editor code
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jadx-out /tmp/probe && mkdir -p /tmp/probe
          /tmp/jadx/bin/jadx --no-res --show-bad-code -d /tmp/jadx-out /tmp/projectivy.apk >/tmp/jadx.log 2>&1 || true

          grep -RIl -E '\.plbackup|BackupParams|ImportSettingsActivity|exportAppearanceSettings|appearance\.plbackup' /tmp/jadx-out/sources | sort > /tmp/probe/matches.txt || true
          test -f /tmp/jadx-out/sources/defpackage/s71.java && echo /tmp/jadx-out/sources/defpackage/s71.java >> /tmp/probe/matches.txt
          sort -u /tmp/probe/matches.txt -o /tmp/probe/matches.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            rel="${f#/tmp/jadx-out/sources/}"
            mkdir -p "/tmp/probe/$(dirname "$rel")"
            cp "$f" "/tmp/probe/$rel"
          done < /tmp/probe/matches.txt

          grep -RIn -E 'AES/CBC/PKCS5Padding|Cipher\.getInstance|SecretKeySpec|IvParameterSpec|plbackup|BackupParams' /tmp/jadx-out/sources > /tmp/probe/crypto-hits.txt || true
          grep -RIn -E 'TvContract\.Channels|TvContract\.PreviewPrograms|internal_provider_id|getApplicationLabel|getApplicationInfo|applicationInfo\.packageName|packageName' /tmp/jadx-out/sources/com/spocky /tmp/jadx-out/sources/defpackage > /tmp/probe/channel-hits.txt || true

          # Copy a focused set of channel/provider candidates for inspection.
          grep -RIl -E 'TvContract\.Channels|internal_provider_id|getApplicationLabel' /tmp/jadx-out/sources/com/spocky /tmp/jadx-out/sources/defpackage | head -80 > /tmp/probe/channel-files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            rel="${f#/tmp/jadx-out/sources/}"
            mkdir -p "/tmp/probe/channel-src/$(dirname "$rel")"
            cp "$f" "/tmp/probe/channel-src/$rel"
          done < /tmp/probe/channel-files.txt

          cp /tmp/jadx.log /tmp/probe/jadx.log
          find /tmp/probe -type f -maxdepth 14 -print
      - uses: actions/upload-artifact@v4
        with:
          name: projectivy-backup-probe
          path: /tmp/probe
          retention-days: 2
