name: Probe Projectivy Backup

on:
  push:
    branches: [projectivy-native-mod]
    paths:
      - '.github/workflows/probe-projectivy-backup.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Projectivy tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/projectivy.apk
          curl -fL --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
      - name: Decompile probes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jadx-out /tmp/apk-out /tmp/probe && mkdir -p /tmp/probe
          /tmp/jadx/bin/jadx --no-res --show-bad-code -d /tmp/jadx-out /tmp/projectivy.apk >/tmp/jadx.log 2>&1 || true
          java -jar /tmp/apktool.jar d -f /tmp/projectivy.apk -o /tmp/apk-out >/tmp/apktool.log 2>&1
          find /tmp/apk-out -name 'g70.smali' -print -exec cp '{}' /tmp/probe/g70.smali \;
          find /tmp/apk-out -name 'e70.smali' -print -exec cp '{}' /tmp/probe/e70.smali \;
          find /tmp/apk-out -name 'm60.smali' -print -exec cp '{}' /tmp/probe/m60.smali \;
          cp /tmp/jadx-out/sources/defpackage/g70.java /tmp/probe/g70.java
          cp /tmp/jadx-out/sources/defpackage/e70.java /tmp/probe/e70.java
          cp /tmp/jadx-out/sources/defpackage/m60.java /tmp/probe/m60.java
          cp /tmp/jadx.log /tmp/probe/jadx.log
          cp /tmp/apktool.log /tmp/probe/apktool.log
      - uses: actions/upload-artifact@v4
        with:
          name: projectivy-backup-probe
          path: /tmp/probe
          retention-days: 2
