name: Projectivy Clean Audit - Startup Coroutine Trace

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-audit-startup-coroutines.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Trace PTApplication startup coroutines and premium state writes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/p.apk
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/p.apk -o /tmp/pj >/dev/null
          O=/tmp/startup-trace; mkdir -p "$O"
          for f in /tmp/pj/smali*/xb0.smali /tmp/pj/smali*/op0.smali /tmp/pj/smali*/no2.smali /tmp/pj/smali*/lf4.smali; do
            [ -f "$f" ] && cp "$f" "$O/$(echo "$f" | sed 's#^/tmp/pj/##; s#/#__#g')"
          done
          {
            echo '=== PTApplication.y reads/writes ==='; grep -Rni -B8 -A18 'PTApplication;->y:Llf4' /tmp/pj/smali* || true
            echo '=== premium state flow writes ==='; grep -Rni -B8 -A18 -E 'Llf4;->(h|i|j|k|l|m|n|o|p|q|r|s|t|u|v|w|x|y|z|[A-Z])\(' /tmp/pj/smali*/xb0.smali /tmp/pj/smali*/op0.smali 2>/dev/null || true
            echo '=== billing/lemon references in startup coroutines ==='; grep -n -B10 -A25 -E 'Billing|billing|jf2|Lemon|license|licence|Premium|gq3|PTApplication;->y' /tmp/pj/smali*/xb0.smali /tmp/pj/smali*/op0.smali 2>/dev/null || true
          } > "$O/references.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-4.72-Startup-Coroutine-Trace
          path: /tmp/startup-trace/*
          retention-days: 7
