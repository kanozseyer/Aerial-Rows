name: Probe CLEAN13.1K Icon Binders 2

on:
  push:
    branches: [projectivy-clean13-1k-weather-choice-mono-icons]
    paths:
      - '.github/workflows/probe-clean13-1k-icon-binders-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract exact icon binder classes
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/probe13k2
          mkdir -p "$OUT"
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/projectivy.apk
          curl -fL --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --no-res --show-bad-code -d /tmp/jadx-out /tmp/projectivy.apk >"$OUT/jadx.log" 2>&1 || true

          for cls in gv hv pq0 cb3 gs1 lo2 wy1 wj2 ko2 bi3 h03; do
            f="/tmp/jadx-out/sources/defpackage/${cls}.java"
            [ -f "$f" ] && cp "$f" "$OUT/${cls}.java"
          done
          cp /tmp/jadx-out/sources/com/spocky/projengmenu/ui/home/header/IconHeaderImageView.java "$OUT/IconHeaderImageView.java"
          cp /tmp/jadx-out/sources/com/spocky/projengmenu/ui/sidePanels/settings/preference/AppPreference.java "$OUT/AppPreference.java"
          cp /tmp/jadx-out/sources/com/spocky/projengmenu/ui/sidePanels/settings/preference/CustomPreference.java "$OUT/CustomPreference.java"

          {
            for f in "$OUT"/*.java; do
              echo "===== $(basename "$f") ====="
              cat "$f"
              echo
            done
          } > "$OUT/ALL.txt"
          sed -n '1,1600p' "$OUT/ALL.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: clean13-1k-icon-binders-2
          path: /tmp/probe13k2
          retention-days: 7
