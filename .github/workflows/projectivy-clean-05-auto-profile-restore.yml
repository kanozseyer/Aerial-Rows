name: Projectivy CLEAN 05 - Automatic Profile Restore

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-05-auto-profile-restore.yml'
      - '.github/clean05/**'
      - '.github/clean04/patch-backup-decrypt-dex.py'
      - '.github/clean03/**'
      - '.github/clean02/**'
      - '.github/patch-clean-01k-projectivy-telemetry.py'
      - '.github/patch-clean-01h-external-license.py'
      - '.github/patch-clean-01g-surgical-dex.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 05
        shell: bash
        run: bash .github/clean05/build-clean05.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-05-Auto-Profile-Restore
          path: /tmp/clean05-artifact/*
          retention-days: 30
