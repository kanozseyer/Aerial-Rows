name: Fix SAF Output Mode

on:
  push:
    branches: [phase6-final-settings-milestone]
    paths: ['.github/workflows/fix-saf-mode.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase6-final-settings-milestone
      - name: Correct SAF output mode
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_saf_mode.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/conreo/couchytv/ui/SettingsSheet.kt
          git commit -m 'Fix SAF backup output mode'
          git push origin HEAD:phase6-final-settings-milestone
