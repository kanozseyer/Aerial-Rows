name: Projectivy Clean 01C - Premium Runtime Off

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-01c-premium-runtime-off.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact official Projectivy 4.72
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/official.apk
          echo 'a312935837b7cf323880455c322f4c98060e3e37e8c6187963fb2c4764534aae  /tmp/official.apk' | sha256sum -c -
          unzip -t /tmp/official.apk >/dev/null

      - name: Patch only the premium refresh startup worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/official.apk -o /tmp/pj >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pj/smali/op0.smali')
          s=p.read_text()
          old='''    new-instance v2, Ls40;\n\n    .line 148\n    .line 149\n    iget-object v0, v0, Lop0;->A:Ljava/lang/Object;\n\n    .line 150\n    .line 151\n    check-cast v0, Lcom/spocky/projengmenu/PTApplication;\n\n    .line 152\n    .line 153\n    const/4 v3, 0x6\n\n    .line 154\n    invoke-direct {v2, v0, v7, v3}, Ls40;-><init>(Ljava/lang/Object;Lxi0;B)V\n\n    .line 155\n    .line 156\n    .line 157\n    invoke-static {v1, v7, v2, v4}, Lko0;->e(Luj0;Llj0;Lnp1;I)Law0;'''
          new='''    # CLEAN 01C: keep Projectivy in its original free/locked state, but do not\n    # launch s40 variant 6. That worker calls PTApplication.d(true), the\n    # premium/licence refresh path. Normal startup workers below remain intact.\n    iget-object v0, v0, Lop0;->A:Ljava/lang/Object;\n\n    check-cast v0, Lcom/spocky/projengmenu/PTApplication;'''
          assert s.count(old)==1, f'premium worker anchor mismatch: {s.count(old)}'
          s=s.replace(old,new,1)
          p.write_text(s)
          assert 'invoke-direct {v2, v0, v7, v6}, Lya3;-><init>' in s
          assert 'invoke-direct {v2, v0, v7, v5}, Lya3;-><init>' in s
          marker=s.index('# CLEAN 01C')
          region=s[marker:marker+1800]
          assert 'Ls40;-><init>' not in region
          print('patched: only s40 variant-6 premium refresh launch removed')

          # Apktool needs three framework-state declarations to rebuild 4.72.
          # This temporary rebuilt APK is used ONLY as a DEX compiler; none of its
          # rebuilt resources are copied into the final APK.
          values=Path('/tmp/pj/res/values')
          attrs=values/'attrs.xml'
          t=attrs.read_text() if attrs.exists() else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
          additions=[]
          for name in ('state_liftable','state_lifted','state_swiped'):
              if f'name="{name}"' not in t:
                  additions.append(f'    <attr name="{name}" format="boolean" />')
          if additions:
              t=t.replace('</resources>', '\n'.join(additions)+'\n</resources>')
              attrs.write_text(t)
          print('temporary compile attrs:', additions)
          PY

          java -jar /tmp/apktool.jar b /tmp/pj -o /tmp/rebuilt.apk >/dev/null
          unzip -p /tmp/rebuilt.apk classes.dex > /tmp/classes.dex
          test -s /tmp/classes.dex

      - name: Repack official APK with only patched classes.dex
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          src='/tmp/official.apk'; out='/tmp/unsigned.apk'; patched='/tmp/classes.dex'
          patched_data=open(patched,'rb').read()
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(out,'w') as zout:
              for info in zin.infolist():
                  if info.filename.startswith('META-INF/'):
                      continue
                  data=patched_data if info.filename=='classes.dex' else zin.read(info.filename)
                  ni=zipfile.ZipInfo(info.filename, info.date_time)
                  ni.compress_type=info.compress_type
                  ni.comment=info.comment; ni.extra=info.extra
                  ni.internal_attr=info.internal_attr; ni.external_attr=info.external_attr
                  ni.create_system=info.create_system; ni.create_version=info.create_version
                  ni.extract_version=info.extract_version; ni.flag_bits=info.flag_bits
                  zout.writestr(ni,data)
          PY
          unzip -t /tmp/unsigned.apk >/dev/null

      - name: Align, sign and verify
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          curl -fL --retry 3 'https://android.googlesource.com/platform/build/+/refs/heads/master/target/product/security/testkey.pk8?format=TEXT' | base64 -d > /tmp/testkey.pk8
          curl -fL --retry 3 'https://android.googlesource.com/platform/build/+/refs/heads/master/target/product/security/testkey.x509.pem?format=TEXT' | base64 -d > /tmp/testkey.x509.pem
          "$ZIPALIGN" -P 16 -f 4 /tmp/unsigned.apk /tmp/aligned.apk
          "$APKSIGNER" sign --key /tmp/testkey.pk8 --cert /tmp/testkey.x509.pem \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/Projectivy-CLEAN-01C-Premium-Runtime-Off.apk /tmp/aligned.apk
          "$APKSIGNER" verify --verbose --print-certs /tmp/Projectivy-CLEAN-01C-Premium-Runtime-Off.apk | tee /tmp/apksigner.txt
          "$ZIPALIGN" -P 16 -c -v 4 /tmp/Projectivy-CLEAN-01C-Premium-Runtime-Off.apk | tee /tmp/zipalign.txt
          "$AAPT" dump badging /tmp/Projectivy-CLEAN-01C-Premium-Runtime-Off.apk | head -1 | tee /tmp/package.txt
          grep -q "package: name='com.spocky.projengmenu'" /tmp/package.txt
          grep -q "versionName='4.72'" /tmp/package.txt

      - name: Prove only classes.dex application payload changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, hashlib
          A='/tmp/official.apk'; B='/tmp/Projectivy-CLEAN-01C-Premium-Runtime-Off.apk'
          za=zipfile.ZipFile(A); zb=zipfile.ZipFile(B)
          ignore=lambda n:n.startswith('META-INF/')
          aa={i.filename for i in za.infolist() if not ignore(i.filename)}
          bb={i.filename for i in zb.infolist() if not ignore(i.filename)}
          assert aa==bb, 'APK entry set changed'
          changed=[]
          for n in sorted(aa):
              if hashlib.sha256(za.read(n)).digest()!=hashlib.sha256(zb.read(n)).digest():
                  changed.append(n)
          assert changed==['classes.dex'], f'unexpected application payload changes: {changed}'
          for n in ('AndroidManifest.xml','resources.arsc','classes2.dex','classes3.dex'):
              assert za.read(n)==zb.read(n), n+' changed unexpectedly'
          libs=[i for i in zb.infolist() if i.filename.startswith('lib/') and i.filename.endswith('.so')]
          assert len(libs)==12 and all(i.compress_type==zipfile.ZIP_STORED for i in libs)
          print('PASS: only classes.dex changed; all other application payload is official 4.72 byte-for-byte')
          PY
          sha256sum /tmp/Projectivy-CLEAN-01C-Premium-Runtime-Off.apk | tee /tmp/SHA256.txt

      - name: Publish artifact
        shell: bash
        run: |
          mkdir -p /tmp/artifact
          cp /tmp/Projectivy-CLEAN-01C-Premium-Runtime-Off.apk /tmp/artifact/
          cp /tmp/SHA256.txt /tmp/artifact/
          cp /tmp/apksigner.txt /tmp/artifact/
          cp /tmp/zipalign.txt /tmp/artifact/
          cp /tmp/package.txt /tmp/artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-01C-Premium-Runtime-Off
          path: /tmp/artifact/*
          retention-days: 30
