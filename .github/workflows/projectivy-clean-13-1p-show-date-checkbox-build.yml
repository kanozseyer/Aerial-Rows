name: Projectivy CLEAN 13.1P - Show Date Native Checkbox

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean13-1p-show-date-native-checkbox
    paths:
      - '.github/clean13_1p/**'
      - '.github/workflows/projectivy-clean-13-1p-show-date-checkbox-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CLEAN13.1P on runtime-approved O
        shell: bash
        run: bash .github/clean13_1p/build-clean13-1p.sh

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-13-1P-Show-Date-Native-Checkbox
          path: /tmp/clean13-1p-artifact.zip
          if-no-files-found: error
