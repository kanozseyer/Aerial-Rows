name: Probe CLEAN 07F Grouped Channel Construction

on:
  push:
    branches: [projectivy-clean07f-native-multiselect]
    paths:
      - '.github/workflows/probe-clean07f-grouped-channel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Decompile Projectivy 4.72 grouped channel path
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/projectivy.apk
          curl -fL --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          rm -rf /tmp/jadx-out /tmp/apk-out /tmp/probe07f
          mkdir -p /tmp/probe07f
          /tmp/jadx/bin/jadx --no-res --show-bad-code -d /tmp/jadx-out /tmp/projectivy.apk >/tmp/probe07f/jadx.log 2>&1 || true
          java -jar /tmp/apktool.jar d -f /tmp/projectivy.apk -o /tmp/apk-out >/tmp/probe07f/apktool.log 2>&1

          for cls in g70 k00 he2 ie2 ge2 i5 vu ft fh3 r10 w40 je2 am1 rm1; do
            f="/tmp/jadx-out/sources/defpackage/${cls}.java"
            [ -f "$f" ] && cp "$f" "/tmp/probe07f/${cls}.java"
            find /tmp/apk-out -name "${cls}.smali" -print -quit | while read -r s; do [ -n "$s" ] && cp "$s" "/tmp/probe07f/${cls}.smali"; done
          done

          custom="/tmp/jadx-out/sources/com/spocky/projengmenu/ui/sidePanels/settings/preference/CustomListPreference.java"
          [ -f "$custom" ] && cp "$custom" /tmp/probe07f/CustomListPreference.java
          find /tmp/apk-out -path '*/com/spocky/projengmenu/ui/sidePanels/settings/preference/CustomListPreference.smali' -print -quit | while read -r s; do [ -n "$s" ] && cp "$s" /tmp/probe07f/CustomListPreference.smali; done

          for cls in ListPreference MultiSelectListPreference DialogPreference Preference PreferenceGroup; do
            f="/tmp/jadx-out/sources/androidx/preference/${cls}.java"
            [ -f "$f" ] && cp "$f" "/tmp/probe07f/${cls}.java"
            find /tmp/apk-out -path "*/androidx/preference/${cls}.smali" -print -quit | while read -r s; do [ -n "$s" ] && cp "$s" "/tmp/probe07f/${cls}.smali"; done
          done

          grep -RniE 'onResume|onStart|onStop|onPause|Lam1;->(C|D|E|G|H|J|K)\(\)V|void [A-Z]\(|k00\.e|class ft|class fh3|ListPreference|MultiSelectListPreference|he2|ie2|action_categories_list|\.n[ ;=]' /tmp/probe07f > /tmp/probe07f/HITS.txt || true
          sha256sum /tmp/projectivy.apk > /tmp/probe07f/OFFICIAL_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clean07f-grouped-channel-probe
          path: /tmp/probe07f
          retention-days: 7
