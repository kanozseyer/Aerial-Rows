name: Projectivy Restore Probe

on:
  workflow_dispatch:
  push:
    branches: [projectivy-native-mod]
    paths:
      - '.github/workflows/projectivy-restore-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and decompile Projectivy
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/projectivy.apk
          curl -fL --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          rm -rf /tmp/jadx-out /tmp/probe
          mkdir -p /tmp/jadx-out /tmp/probe/src
          /tmp/jadx/bin/jadx -d /tmp/jadx-out /tmp/projectivy.apk >/tmp/probe/jadx.log 2>&1 || true
          grep -RilE 'plbackup|backup|restore|import.*settings|export.*settings|action_categories_list' /tmp/jadx-out/sources | head -n 180 > /tmp/probe/hit-files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            rel="${f#/tmp/jadx-out/sources/}"
            mkdir -p "/tmp/probe/src/$(dirname "$rel")"
            cp "$f" "/tmp/probe/src/$rel"
          done < /tmp/probe/hit-files.txt
          grep -RniE 'plbackup|backup|restore|import|export|action_categories_list|SharedPreferences|Cipher|SecretKey|Base64' /tmp/probe/src > /tmp/probe/hits.txt || true
          for cls in w40 u40 t40 hj3 yh3 dj3 dh4 fw2 pi3 xi3 gi3 hi3 ii3 li3 mi3 qi3 si3 ti3; do
            f="/tmp/jadx-out/sources/defpackage/${cls}.java"
            [ -f "$f" ] && cp "$f" "/tmp/probe/${cls}.java"
          done
          cp /tmp/jadx-out/sources/com/spocky/projengmenu/ui/launcherActivities/ImportSettingsActivity.java /tmp/probe/ImportSettingsActivity.java
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-Restore-Probe
          path: /tmp/probe
          retention-days: 2
