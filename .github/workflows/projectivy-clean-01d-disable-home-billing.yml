name: Projectivy Clean 01D - Disable Home Billing

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-01d-disable-home-billing.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact official Projectivy 4.72
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/official.apk
          echo 'a312935837b7cf323880455c322f4c98060e3e37e8c6187963fb2c4764534aae  /tmp/official.apk' | sha256sum -c -
          unzip -t /tmp/official.apk >/dev/null

      - name: Patch only MainFragment BillingClient connect call
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/official.apk -o /tmp/pj >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pj/smali/s40.smali')
          s=p.read_text()
          needle='    invoke-virtual {p1}, Lit1;->g()V'
          # s40 contains multiple Lit1.g callers; identify the selector-2/MainFragment
          # one by its local context, not by global replacement.
          pos=[]
          start=0
          while True:
              i=s.find(needle,start)
              if i<0: break
              pos.append(i); start=i+1
          matches=[]
          for i in pos:
              ctx=s[max(0,i-1800):i+300]
              if 'check-cast p0, Lcom/spocky/projengmenu/ui/home/MainFragment;' in ctx and ':pswitch_7' in ctx:
                  matches.append(i)
          if len(matches)!=1:
              raise SystemExit(f'expected exactly one MainFragment billing connect call, found {len(matches)} of {len(pos)} Lit1.g calls')
          i=matches[0]
          s=s[:i]+'    # CLEAN 01D: normal Home does not connect to Google Play Billing.\n    # Free/locked state and surrounding Home flow remain unchanged.\n    nop'+s[i+len(needle):]
          p.write_text(s)
          print('patched one MainFragment Lit1.g() BillingClient connection call')
          PY

          # Projectivy 4.72 resource-table compatibility fix is only for the
          # temporary Apktool compile. No rebuilt resources enter the final APK.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pj/res/values/attrs.xml')
          s=p.read_text()
          marker='</resources>'
          extra='''    <attr name="state_liftable" format="boolean" />\n    <attr name="state_lifted" format="boolean" />\n    <attr name="state_swiped" format="boolean" />\n'''
          if 'name="state_liftable"' not in s:
              s=s.replace(marker,extra+marker)
              p.write_text(s)
          PY

          java -jar /tmp/apktool.jar b /tmp/pj -o /tmp/rebuilt.apk >/dev/null
          unzip -p /tmp/rebuilt.apk classes.dex > /tmp/classes.dex
          test -s /tmp/classes.dex

      - name: Repack official APK with only patched classes.dex
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          src='/tmp/official.apk'; out='/tmp/unsigned.apk'; patched='/tmp/classes.dex'
          pdata=open(patched,'rb').read()
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(out,'w') as zout:
              for info in zin.infolist():
                  if info.filename.startswith('META-INF/'):
                      continue
                  data=pdata if info.filename=='classes.dex' else zin.read(info.filename)
                  ni=zipfile.ZipInfo(info.filename, info.date_time)
                  ni.compress_type=info.compress_type
                  ni.comment=info.comment; ni.extra=info.extra
                  ni.internal_attr=info.internal_attr; ni.external_attr=info.external_attr
                  ni.create_system=info.create_system; ni.create_version=info.create_version
                  ni.extract_version=info.extract_version; ni.flag_bits=info.flag_bits
                  zout.writestr(ni,data)
          PY
          unzip -t /tmp/unsigned.apk >/dev/null

      - name: Align, sign and verify
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"; APKSIGNER="$BUILD_TOOLS/apksigner"; AAPT="$BUILD_TOOLS/aapt"
          curl -fL --retry 3 'https://android.googlesource.com/platform/build/+/refs/heads/master/target/product/security/testkey.pk8?format=TEXT' | base64 -d > /tmp/testkey.pk8
          curl -fL --retry 3 'https://android.googlesource.com/platform/build/+/refs/heads/master/target/product/security/testkey.x509.pem?format=TEXT' | base64 -d > /tmp/testkey.x509.pem
          "$ZIPALIGN" -P 16 -f 4 /tmp/unsigned.apk /tmp/aligned.apk
          "$APKSIGNER" sign --key /tmp/testkey.pk8 --cert /tmp/testkey.x509.pem --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out /tmp/Projectivy-CLEAN-01D-No-Home-Billing.apk /tmp/aligned.apk
          "$APKSIGNER" verify --verbose --print-certs /tmp/Projectivy-CLEAN-01D-No-Home-Billing.apk | tee /tmp/apksigner.txt
          "$ZIPALIGN" -P 16 -c -v 4 /tmp/Projectivy-CLEAN-01D-No-Home-Billing.apk | tee /tmp/zipalign.txt
          "$AAPT" dump badging /tmp/Projectivy-CLEAN-01D-No-Home-Billing.apk | head -1 | tee /tmp/package.txt
          grep -q "package: name='com.spocky.projengmenu'" /tmp/package.txt
          grep -q "versionName='4.72'" /tmp/package.txt

      - name: Prove only classes.dex changed from official 4.72
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,hashlib
          A='/tmp/official.apk'; B='/tmp/Projectivy-CLEAN-01D-No-Home-Billing.apk'
          za=zipfile.ZipFile(A); zb=zipfile.ZipFile(B)
          ign=lambda n:n.startswith('META-INF/')
          aa={i.filename for i in za.infolist() if not ign(i.filename)}; bb={i.filename for i in zb.infolist() if not ign(i.filename)}
          assert aa==bb, 'entry set changed'
          changed=[n for n in sorted(aa) if hashlib.sha256(za.read(n)).digest()!=hashlib.sha256(zb.read(n)).digest()]
          assert changed==['classes.dex'], f'unexpected payload changes: {changed}'
          for n in ('AndroidManifest.xml','resources.arsc','classes2.dex','classes3.dex'):
              assert za.read(n)==zb.read(n), n+' changed'
          libs=[i for i in zb.infolist() if i.filename.startswith('lib/') and i.filename.endswith('.so')]
          assert len(libs)==12 and all(i.compress_type==zipfile.ZIP_STORED for i in libs)
          print('PASS: only classes.dex changed; all other payload remains official 4.72 byte-for-byte')
          PY
          sha256sum /tmp/Projectivy-CLEAN-01D-No-Home-Billing.apk | tee /tmp/SHA256.txt

      - name: Publish artifact
        shell: bash
        run: |
          mkdir -p /tmp/artifact
          cp /tmp/Projectivy-CLEAN-01D-No-Home-Billing.apk /tmp/artifact/
          cp /tmp/SHA256.txt /tmp/apksigner.txt /tmp/zipalign.txt /tmp/package.txt /tmp/artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-01D-No-Home-Billing
          path: /tmp/artifact/*
          retention-days: 30
