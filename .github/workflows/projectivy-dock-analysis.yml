name: Projectivy 4.72 Dock Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-liquid-glass
    paths:
      - '.github/workflows/projectivy-dock-analysis.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patcher branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and verify official Projectivy 4.72
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/projectivy-analysis"
          cd "$RUNNER_TEMP/projectivy-analysis"
          curl -fL --retry 3 \
            'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' \
            -o ProjectivyLauncher-4.72-c97-xda-release.apk
          echo 'a312935837b7cf323880455c322f4c98060e3e37e8c6187963fb2c4764534aae  ProjectivyLauncher-4.72-c97-xda-release.apk' | sha256sum -c -

      - name: Download current JADX CLI and Apktool
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/projectivy-analysis"

          JADX_URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] | select((.name | startswith("jadx-")) and (.name | endswith(".zip")) and ((.name | contains("gui")) | not)) | .browser_download_url' \
            | head -n 1)"
          test -n "$JADX_URL"
          curl -fL --retry 3 "$JADX_URL" -o jadx.zip
          mkdir jadx
          unzip -q jadx.zip -d jadx

          APKTOOL_URL="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' \
            | head -n 1)"
          test -n "$APKTOOL_URL"
          curl -fL --retry 3 "$APKTOOL_URL" -o apktool.jar

          ./jadx/bin/jadx --version
          java -jar apktool.jar --version

      - name: Decode exact smali and locate row presenter
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/projectivy-analysis"
          APK="$PWD/ProjectivyLauncher-4.72-c97-xda-release.apk"
          java -jar apktool.jar d -f -r "$APK" -o apktool-out >/tmp/apktool.log 2>&1 || {
            tail -n 100 /tmp/apktool.log
            exit 1
          }

          # JADX represents APK classes with no Java package as defpackage.*;
          # apktool keeps the original DEX identity at the smali root.
          LU_SMALI="$(find apktool-out -type f -name 'lu.smali' -print -quit)"
          if [[ -z "$LU_SMALI" ]]; then
            echo 'lu.smali not found; listing HorizontalGridView/background candidates'
            grep -RIl --include='*.smali' 'Landroidx/leanback/widget/HorizontalGridView;' apktool-out \
              | head -n 100 || true
            exit 1
          fi
          echo "lu_smali=$LU_SMALI" >> "$GITHUB_ENV"

          {
            echo '=== VERIFIED INPUT ==='
            sha256sum "$APK"
            echo
            echo '=== SMALI DOCK RENDERER FILE ==='
            echo "$LU_SMALI"
            echo
            echo '=== SMALI METHOD SIGNATURES ==='
            grep -n '^\.method' "$LU_SMALI" || true
            echo
            echo '=== SMALI DRAWABLE / BACKGROUND SIGNALS ==='
            grep -nE 'GradientDrawable|MaterialShapeDrawable|setBackground|setBackgroundColor|setColor|setCornerRadius|setCornerRadii|setStroke|setPadding' "$LU_SMALI" || true
            echo
            echo '=== CATEGORY BACKGROUND FIELD READS NEAR LU ==='
            grep -nE 'Li5;->B:|Ldefpackage/i5;->B:|iget.*->B:' "$LU_SMALI" || true
            echo
            echo '=== ROW PRESENTER INHERITANCE CANDIDATES ==='
            grep -RIn --include='*.smali' -E '^\.super Llu;|^\.class .* L(jo4|f23);' apktool-out | head -n 100 || true
          } | tee dock-analysis.txt

      - name: Decompile Java view of renderer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/projectivy-analysis"
          APK="$PWD/ProjectivyLauncher-4.72-c97-xda-release.apk"
          mkdir -p jadx-out

          # A few unrelated methods in this heavily optimized APK do not decompile
          # cleanly in stock JADX. That must not discard the thousands of usable
          # source files produced before JADX returns its non-zero warning status.
          set +e
          ./jadx/bin/jadx --no-res --show-bad-code -d jadx-out "$APK" >/tmp/jadx.log 2>&1
          JADX_RC=$?
          set -e
          echo "JADX exit status: $JADX_RC (non-zero is tolerated when sources exist)"
          tail -n 8 /tmp/jadx.log || true
          test -d jadx-out/sources

          LU_FILE="$(find jadx-out/sources -type f -iname 'lu.java' -print -quit)"
          if [[ -z "$LU_FILE" ]]; then
            LU_FILE="$(grep -RIl --include='*.java' -m1 -E '(^|[[:space:]])(public[[:space:]]+)?(abstract[[:space:]]+)?class[[:space:]]+lu([[:space:]]|\{|extends)' jadx-out/sources | head -n 1 || true)"
          fi
          if [[ -z "$LU_FILE" ]]; then
            echo 'JADX lu class not found; falling back to signature candidates.'
            LU_FILE="$(grep -RIl --include='*.java' -m1 'HorizontalGridView' jadx-out/sources \
              | while read -r f; do grep -Eq 'setBackground|GradientDrawable|MaterialShapeDrawable' "$f" && { echo "$f"; break; }; done || true)"
          fi
          test -n "$LU_FILE"
          echo "lu_java=$LU_FILE" >> "$GITHUB_ENV"

          {
            echo
            echo '=== JADX DOCK RENDERER FILE ==='
            echo "$LU_FILE"
            echo
            echo '=== JAVA DRAWABLE / BACKGROUND SIGNALS ==='
            grep -nE 'GradientDrawable|MaterialShapeDrawable|setBackground|setBackgroundColor|setColor\(|setCornerRadius|setCornerRadii|setStroke|setPadding|HorizontalGridView' "$LU_FILE" || true
            echo
            echo '=== ROW PRESENTER REFERENCES ==='
            grep -RIn --include='*.java' -E 'extends[[:space:]]+lu|class[[:space:]]+(jo4|f23)' jadx-out/sources | head -n 120 || true
          } | tee -a dock-analysis.txt

      - name: Print compact context around candidate instructions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/projectivy-analysis"
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          paths = [Path(os.environ['lu_java']), Path(os.environ['lu_smali'])]
          needles = re.compile(r'GradientDrawable|MaterialShapeDrawable|setBackground|setColor|setCornerRadius|setCornerRadii|setStroke|->B:')
          out = Path('dock-analysis.txt')
          with out.open('a', encoding='utf-8') as f:
              for path in paths:
                  lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
                  hits = [i for i, line in enumerate(lines) if needles.search(line)]
                  f.write(f'\n=== CONTEXT: {path} ===\n')
                  emitted = set()
                  for i in hits[:20]:
                      start, end = max(0, i-6), min(len(lines), i+7)
                      key = (start, end)
                      if key in emitted:
                          continue
                      emitted.add(key)
                      f.write(f'--- lines {start+1}-{end} ---\n')
                      for n in range(start, end):
                          f.write(f'{n+1:5}: {lines[n]}\n')
          PY
          tail -n 360 dock-analysis.txt

      - name: Upload compact analysis only
        uses: actions/upload-artifact@v4
        with:
          name: projectivy-4.72-dock-analysis
          path: ${{ runner.temp }}/projectivy-analysis/dock-analysis.txt
          if-no-files-found: error
          retention-days: 3
