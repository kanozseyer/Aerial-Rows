name: Phase 0A Lint Fix

on:
  push:
    branches: [phase0a-source-pure]
    paths:
      - '.github/workflows/phase0a-lint-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase0a-source-pure
          fetch-depth: 0
      - name: Mark newly materialized English-only strings non-translatable
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text()
          s = s.replace('<string name="mode_sliding_rows">Sliding Rows</string>', '<string name="mode_sliding_rows" translatable="false">Sliding Rows</string>')
          s = s.replace('<string name="mode_sliding_rows_desc">Projectivy-style horizontal rows — selection moves naturally and Left reveals the navigation pane</string>', '<string name="mode_sliding_rows_desc" translatable="false">Projectivy-style horizontal rows — selection moves naturally and Left reveals the navigation pane</string>')
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name 'Aerial Rows Phase 0A'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/res/values/strings.xml
          git diff --cached --check
          git commit -m 'Fix lint for materialized Sliding Rows strings'
          git push origin HEAD:phase0a-source-pure
