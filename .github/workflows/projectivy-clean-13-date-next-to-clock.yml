name: Projectivy CLEAN 13 - Date Next To Clock

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean13-date-next-to-clock
    paths:
      - '.github/clean13/**'
      - '.github/workflows/projectivy-clean-13-date-next-to-clock.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and verify CLEAN 13
        run: bash .github/clean13/build-clean13.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-13-Date-Next-To-Clock
          path: /tmp/clean13-artifact/*
          if-no-files-found: error
