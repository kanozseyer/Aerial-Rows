name: Projectivy CLEAN 13.1I - Weather Order Only

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean13-1i-weather-order
    paths:
      - '.github/clean13_1i/**'
      - '.github/workflows/projectivy-clean-13-1i-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CLEAN13.1I
        shell: bash
        run: bash .github/clean13_1i/build-clean13-1i.sh

      - name: Upload CLEAN13.1I artifact
        uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-13-1I-Weather-Order-Only
          path: /tmp/clean13-1i-artifact/*
          if-no-files-found: error
