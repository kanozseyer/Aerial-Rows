name: Projectivy CLEAN 07H - Single Navigation Live Visibility

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean07h-single-navigation]
    paths:
      - '.github/workflows/projectivy-clean-07h-single-navigation.yml'
      - '.github/clean07h/**'
      - '.github/clean07f/**'
      - '.github/clean07/**'
      - '.github/clean06/**'
      - '.github/clean05/**'
      - '.github/clean04/**'
      - '.github/clean03/**'
      - '.github/clean02/**'
      - '.github/patch-clean-01k-projectivy-telemetry.py'
      - '.github/patch-clean-01h-external-license.py'
      - '.github/patch-clean-01g-surgical-dex.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 07H
        shell: bash
        run: bash .github/clean07h/build-clean07h.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-07H-Single-Navigation-Live-Visibility
          path: /tmp/clean07h-artifact/*
          retention-days: 30
