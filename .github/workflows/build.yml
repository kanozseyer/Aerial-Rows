name: Build

on:
  push:
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to compare a PR against its true base when deciding whether
          # benchmark-only variants need compilation.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Decide whether benchmark APKs need compilation
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          extended=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            extended=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
            printf '%s\n' "$CHANGED"
            if grep -Eq '^(.github/workflows/build\.yml|macrobenchmark/|app/build\.gradle\.kts|build\.gradle\.kts|settings\.gradle\.kts|gradle/|gradle\.properties|app/proguard-rules\.pro|app/src/main/AndroidManifest\.xml)' <<<"$CHANGED"; then
              extended=true
            fi
          else
            extended=true
          fi
          echo "extended=$extended" >> "$GITHUB_OUTPUT"

      # Release/R8 and lint stay mandatory for every product milestone. Device-test
      # sources are also compiled every time because they may reference app APIs.
      - name: Test, build release, compile device tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintRelease --no-daemon

      # Benchmark variants compile the same app main source as release. Rebuild
      # them when benchmark/build configuration changes, and always for tags.
      - name: Compile benchmark APKs
        if: steps.scope.outputs.extended == 'true'
        run: ./gradlew :app:assembleBenchmark :macrobenchmark:assembleBenchmark --no-daemon

      - name: Verify build does not mutate tracked source
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "::error::Gradle build mutated tracked repository files"
            git status --short
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # Strip whitespace/CR so a wrapped or copy-pasted secret still decodes.
        run: echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/couchy-release.jks

      - name: Build signed release
        env:
          KEYSTORE_FILE: /tmp/couchy-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          RELEASE_APK="Couchy-Launcher-${{ github.ref_name }}.apk"
          cp "$APK" "$RELEASE_APK"
          # Replace an existing release without ever deleting or recreating the tag.
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            "$RELEASE_APK" \
            --verify-tag \
            --title "Couchy-Launcher ${{ github.ref_name }}" \
            --generate-notes
