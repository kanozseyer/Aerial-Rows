name: Projectivy Clean Audit - settingsActivity Consumer
on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-audit-settingsactivity-consumer.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Trace y05.h Configure consumer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/official.apk
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/official.apk -o /tmp/pj >/dev/null
          mkdir -p /tmp/audit
          grep -R -n -B60 -A120 --include='*.smali' 'Ly05;->h:Ljava/lang/String;' /tmp/pj/smali* > /tmp/audit/y05-h-consumers.txt || true
          grep -R -n -B60 -A120 --include='*.smali' 'startActivity' /tmp/pj/smali* | grep -B60 -A120 'Ly05;' > /tmp/audit/startactivity-y05.txt || true
          wc -l /tmp/audit/*
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-settingsActivity-Consumer-Audit
          path: /tmp/audit/*
          retention-days: 7
