name: Projectivy CLEAN 07E - Stock Dialog MultiSelect

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean07e-stock-multiselect]
    paths:
      - '.github/workflows/projectivy-clean-07e-stock-dialog.yml'
      - '.github/clean07e/**'
      - '.github/clean07/**'
      - '.github/clean06/**'
      - '.github/clean05/**'
      - '.github/clean04/**'
      - '.github/clean03/**'
      - '.github/clean02/**'
      - '.github/patch-clean-01k-projectivy-telemetry.py'
      - '.github/patch-clean-01h-external-license.py'
      - '.github/patch-clean-01g-surgical-dex.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 07E
        shell: bash
        run: bash .github/clean07e/build-clean07e.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-07E-Stock-Dialog-MultiSelect
          path: /tmp/clean07e-artifact/*
          retention-days: 30
