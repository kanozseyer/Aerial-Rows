name: Projectivy CLEAN14 - Universal Carousel Audit

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean14-universal-carousel
    paths:
      - '.github/clean14/**'
      - '.github/workflows/projectivy-clean-14-universal-carousel-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout frozen P-based CLEAN14 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebuild CLEAN13.1P and audit shared horizontal row implementation
        shell: bash
        run: bash .github/clean14/audit-clean14.sh

      - name: Upload focused source audit
        uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN14-Universal-Carousel-Source-Audit
          path: /tmp/clean14-row-audit/
          if-no-files-found: error
