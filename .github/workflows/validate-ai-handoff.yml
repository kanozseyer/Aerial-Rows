name: Validate AI Handoff Archive

on:
  push:
    paths:
      - 'docs/ai-handoff/**'
      - '.github/workflows/validate-ai-handoff.yml'
  pull_request:
    paths:
      - 'docs/ai-handoff/**'
      - '.github/workflows/validate-ai-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate raw AI handoff archive
        run: python docs/ai-handoff/tools/validate_archive.py
