name: Validate AI Handoff Archive

on:
  push:
    paths:
      - 'docs/ai-handoff/**'
      - '.github/workflows/validate-ai-handoff.yml'
  pull_request:
    paths:
      - 'docs/ai-handoff/**'
      - '.github/workflows/validate-ai-handoff.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate raw AI handoff archive
        run: python docs/ai-handoff/tools/validate_archive.py
