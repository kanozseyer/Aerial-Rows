name: Projectivy Clean Audit - Billing Builder Trace

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-audit-billing-builder.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode and trace BillingClient builder
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/official.apk
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/official.apk -o /tmp/pj >/dev/null
          mkdir -p /tmp/out
          cp /tmp/pj/smali/b5.smali /tmp/out/b5.smali
          {
            echo '=== b5 constructors/calls ==='
            grep -R -n -B12 -A28 -E 'new-instance .*Lb5;|invoke-(direct|virtual|static|interface).*Lb5;|sget-object .*Lb5;' /tmp/pj/smali /tmp/pj/smali_classes2 /tmp/pj/smali_classes3 2>/dev/null || true
            echo
            echo '=== it1 constructor/calls ==='
            grep -R -n -B12 -A28 -E 'new-instance .*Lit1;|invoke-(direct|virtual|static|interface).*Lit1;|sget-object .*Lit1;' /tmp/pj/smali /tmp/pj/smali_classes2 /tmp/pj/smali_classes3 2>/dev/null || true
            echo
            echo '=== Direct BillingClient builder methods by signature ==='
            grep -R -n -B12 -A30 -E 'Pending purchases for one-time products|BillingClient is already in the process|Starting in-app billing setup' /tmp/pj/smali /tmp/pj/smali_classes2 /tmp/pj/smali_classes3 2>/dev/null || true
          } > /tmp/out/references.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-4.72-Billing-Builder-Trace
          path: /tmp/out/*
          retention-days: 7
