name: Projectivy CLEAN 13.1 - Weather

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean13-1-weather
    paths:
      - '.github/clean13_1/**'
      - '.github/workflows/projectivy-clean-13-1-weather.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN13.1E
        run: bash .github/clean13_1/build-clean13-1e.sh
      - name: Upload CLEAN13.1E
        uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-13-1E-Weather-UI-Polish
          path: /tmp/clean13-1-artifact/**
          if-no-files-found: error
