name: Projectivy CLEAN 12.1a - Diagnostic Mismatch

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean12-1a-diagnostic-mismatch
    paths:
      - '.github/clean121a/**'
      - '.github/workflows/projectivy-clean-12-1a-diagnostic-mismatch.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 12.1a
        run: bash .github/clean121a/build-clean121a.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-12-1A-Diagnostic-Mismatch
          path: /tmp/clean121a-artifact/
          if-no-files-found: error
