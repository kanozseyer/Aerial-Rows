name: Projectivy Clean 01G v2 - Remove Premium Surface

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-01g-remove-premium-surface-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact official Projectivy 4.72
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/official.apk
          echo 'a312935837b7cf323880455c322f4c98060e3e37e8c6187963fb2c4764534aae  /tmp/official.apk' | sha256sum -c -
      - name: Decode and patch billing plus premium surface
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/official.apk -o /tmp/pj >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Proven billing-source no-op from 01E/01F.
          p=Path('/tmp/pj/smali/it1.smali'); s=p.read_text()
          m=re.search(r'\.method public final g\(\)V\n.*?\.end method',s,re.S)
          if not m: raise SystemExit('Lit1.g() not found')
          s=s[:m.start()]+'.method public final g()V\n    .locals 0\n    # CLEAN 01G: Google Billing connection disabled.\n    return-void\n.end method'+s[m.end():]
          p.write_text(s)

          # Manifest: remove billing integration and premium activities.
          p=Path('/tmp/pj/AndroidManifest.xml'); s=p.read_text()
          s=re.sub(r'\s*<uses-permission android:name="com\.android\.vending\.BILLING"\s*/>','',s)
          s=re.sub(r'\s*<activity[^>]*android:name="com\.android\.billingclient\.api\.ProxyBillingActivity(?:V2)?"[^>]*/>','',s)
          s=re.sub(r'\s*<meta-data[^>]*android:name="com\.google\.android\.play\.billingclient\.version"[^>]*/>','',s)
          s=re.sub(r'\s*<intent>\s*<action android:name="com\.android\.vending\.billing\.InAppBillingService\.BIND"\s*/>\s*</intent>','',s)
          s=re.sub(r'\s*<intent>\s*<action android:name="com\.google\.android\.apps\.play\.billingtestcompanion\.BillingOverrideService\.BIND"\s*/>\s*</intent>','',s)
          s=re.sub(r'\s*<activity[^>]*android:name="com\.spocky\.projengmenu\.ui\.guidedActions\.activities\.about\.PremiumActivity"[^>]*/>','',s)
          s=re.sub(r'\s*<activity[^>]*android:name="com\.spocky\.projengmenu\.ui\.guidedActions\.activities\.about\.PremiumCardActivity"[^>]*/>','',s)
          p.write_text(s)

          premium='Lcom/spocky/projengmenu/ui/guidedActions/activities/about/PremiumActivity;'
          callers=[
            '/tmp/pj/smali_classes2/com/spocky/projengmenu/ui/launcherActivities/ImportThemeActivity.smali',
            '/tmp/pj/smali_classes2/com/spocky/projengmenu/ui/launcherActivities/SetBackgroundActivity.smali',
            '/tmp/pj/smali_classes2/com/spocky/projengmenu/ui/launcherActivities/ToggleParentalControlActivity.smali',
            '/tmp/pj/smali_classes2/gh.smali',
            '/tmp/pj/smali_classes2/ft.smali',
          ]
          for fn in callers:
              p=Path(fn); s=p.read_text()
              if premium not in s: raise SystemExit(f'premium ref not found in {fn}')
              pos=s.find(premium)
              start=s.rfind('    new-instance ',0,pos)
              # ft declares the class before entering the launch block; search forward for the Intent in that case.
              if start < 0 or 'Landroid/content/Intent;' not in s[start:s.find('\n',start)+1]:
                  start=s.find('    new-instance ',pos)
              while start >= 0 and 'Landroid/content/Intent;' not in s[start:s.find('\n',start)+1]:
                  start=s.find('    new-instance ',start+1)
              if start < 0: raise SystemExit(f'premium Intent block not found in {fn}')
              e=s.find('->startActivity(Landroid/content/Intent;)V',start)
              if e < 0: raise SystemExit(f'premium startActivity not found in {fn}')
              e=s.find('\n',e)+1
              block=s[start:e]
              # For ft the class load is just before the block, so block may not contain descriptor.
              s=s[:start]+'    # CLEAN 01G: premium upgrade redirect removed.\n    nop\n'+s[e:]
              # Any remaining preloaded PremiumActivity const-class is now dead; neutralise it.
              s=s.replace(premium,'Ljava/lang/Object;')
              if 'PremiumActivity;' in s: raise SystemExit(f'remaining premium ref in {fn}')
              p.write_text(s)

          # About list A: [About App, Premium, About Device, About Background]
          # becomes [About App, About Device, About Background].
          p=Path('/tmp/pj/smali/w40.smali'); s=p.read_text()
          old='''    new-array v0, v4, [Ld90;\n\n    .line 672\n    .line 673\n    aput-object v12, v0, v11\n\n    .line 674\n    .line 675\n    aput-object v13, v0, v1\n\n    .line 676\n    .line 677\n    aput-object v14, v0, v2\n\n    .line 678\n    .line 679\n    aput-object v15, v0, v3'''
          new='''    const/4 v0, 0x3\n    new-array v0, v0, [Ld90;\n\n    .line 672\n    .line 673\n    aput-object v12, v0, v11\n\n    .line 674\n    .line 675\n    aput-object v14, v0, v1\n\n    .line 676\n    .line 677\n    aput-object v15, v0, v2'''
          if old not in s: raise SystemExit('About menu array not found')
          s=s.replace(old,new,1)
          needle='    sget-object v19, Lcom/spocky/projengmenu/ui/guidedActions/activities/about/PremiumCardActivity;->e0:Lp;'
          if s.count(needle)!=1: raise SystemExit('PremiumCard menu ref count unexpected')
          s=s.replace(needle,'    const/4 v19, 0x0',1)
          p.write_text(s)

          # No live code may reference either premium activity outside their own dead definitions.
          bad=[]
          for root in [Path('/tmp/pj/smali'),Path('/tmp/pj/smali_classes2'),Path('/tmp/pj/smali_classes3')]:
              for f in root.rglob('*.smali'):
                  if f.name in ('PremiumActivity.smali','PremiumCardActivity.smali'): continue
                  t=f.read_text(errors='ignore')
                  if 'PremiumActivity;' in t or 'PremiumCardActivity;' in t: bad.append(str(f))
          if bad: raise SystemExit('remaining premium refs '+repr(bad))
          print('PASS: premium activities have no live callers')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pj/res/values/attrs.xml'); s=p.read_text(); marker='</resources>'
          extra='''    <attr name="state_liftable" format="boolean" />\n    <attr name="state_lifted" format="boolean" />\n    <attr name="state_swiped" format="boolean" />\n'''
          if 'name="state_liftable"' not in s: p.write_text(s.replace(marker,extra+marker))
          PY
          java -jar /tmp/apktool.jar b /tmp/pj -o /tmp/rebuilt.apk >/dev/null
          unzip -p /tmp/rebuilt.apk classes.dex > /tmp/classes.dex
          unzip -p /tmp/rebuilt.apk classes2.dex > /tmp/classes2.dex
          unzip -p /tmp/rebuilt.apk AndroidManifest.xml > /tmp/AndroidManifest.xml
      - name: Repack official payload with only required files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          repl={'classes.dex':open('/tmp/classes.dex','rb').read(),'classes2.dex':open('/tmp/classes2.dex','rb').read(),'AndroidManifest.xml':open('/tmp/AndroidManifest.xml','rb').read()}
          with zipfile.ZipFile('/tmp/official.apk') as zin, zipfile.ZipFile('/tmp/unsigned.apk','w') as zout:
              for i in zin.infolist():
                  if i.filename.startswith('META-INF/'): continue
                  data=repl.get(i.filename,zin.read(i.filename))
                  n=zipfile.ZipInfo(i.filename,i.date_time); n.compress_type=i.compress_type; n.comment=i.comment; n.extra=i.extra; n.internal_attr=i.internal_attr; n.external_attr=i.external_attr; n.create_system=i.create_system; n.create_version=i.create_version; n.extract_version=i.extract_version; n.flag_bits=i.flag_bits
                  zout.writestr(n,data)
          PY
      - name: Align sign verify and report DEX cost
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"; ZIPALIGN="$BT/zipalign"; APKSIGNER="$BT/apksigner"; AAPT="$BT/aapt"
          curl -fL --retry 3 'https://android.googlesource.com/platform/build/+/refs/heads/master/target/product/security/testkey.pk8?format=TEXT' | base64 -d > /tmp/testkey.pk8
          curl -fL --retry 3 'https://android.googlesource.com/platform/build/+/refs/heads/master/target/product/security/testkey.x509.pem?format=TEXT' | base64 -d > /tmp/testkey.x509.pem
          "$ZIPALIGN" -P 16 -f 4 /tmp/unsigned.apk /tmp/aligned.apk
          "$APKSIGNER" sign --key /tmp/testkey.pk8 --cert /tmp/testkey.x509.pem --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out /tmp/Projectivy-CLEAN-01G-Premium-Surface-Removed.apk /tmp/aligned.apk
          "$APKSIGNER" verify --verbose /tmp/Projectivy-CLEAN-01G-Premium-Surface-Removed.apk
          "$ZIPALIGN" -P 16 -c 4 /tmp/Projectivy-CLEAN-01G-Premium-Surface-Removed.apk
          "$AAPT" dump permissions /tmp/Projectivy-CLEAN-01G-Premium-Surface-Removed.apk > /tmp/permissions.txt
          "$AAPT" dump xmltree /tmp/Projectivy-CLEAN-01G-Premium-Surface-Removed.apk AndroidManifest.xml > /tmp/manifest.txt
          ! grep -q 'com.android.vending.BILLING' /tmp/permissions.txt
          ! grep -q 'ProxyBillingActivity' /tmp/manifest.txt
          ! grep -q 'BillingOverrideService' /tmp/manifest.txt
          ! grep -q 'PremiumActivity' /tmp/manifest.txt
          ! grep -q 'PremiumCardActivity' /tmp/manifest.txt
          python3 - <<'PY' | tee /tmp/scope.txt
          import zipfile,hashlib
          a=zipfile.ZipFile('/tmp/official.apk'); b=zipfile.ZipFile('/tmp/Projectivy-CLEAN-01G-Premium-Surface-Removed.apk')
          ign=lambda n:n.startswith('META-INF/')
          aa={i.filename for i in a.infolist() if not ign(i.filename)}; bb={i.filename for i in b.infolist() if not ign(i.filename)}; assert aa==bb
          changed=[n for n in sorted(aa) if hashlib.sha256(a.read(n)).digest()!=hashlib.sha256(b.read(n)).digest()]
          assert changed==['AndroidManifest.xml','classes.dex','classes2.dex'],changed
          assert a.read('classes3.dex')==b.read('classes3.dex') and a.read('resources.arsc')==b.read('resources.arsc')
          print('changed:',changed)
          print('classes.dex official/new:',len(a.read('classes.dex')),len(b.read('classes.dex')))
          print('classes2.dex official/new:',len(a.read('classes2.dex')),len(b.read('classes2.dex')))
          print('APK official/new:',__import__('os').path.getsize('/tmp/official.apk'),__import__('os').path.getsize('/tmp/Projectivy-CLEAN-01G-Premium-Surface-Removed.apk'))
          PY
          sha256sum /tmp/Projectivy-CLEAN-01G-Premium-Surface-Removed.apk | tee /tmp/SHA256.txt
      - name: Publish artifact
        shell: bash
        run: |
          mkdir -p /tmp/artifact; cp /tmp/Projectivy-CLEAN-01G-Premium-Surface-Removed.apk /tmp/artifact/; cp /tmp/SHA256.txt /tmp/scope.txt /tmp/permissions.txt /tmp/manifest.txt /tmp/artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-01G-Premium-Surface-Removed
          path: /tmp/artifact/*
          retention-days: 30
