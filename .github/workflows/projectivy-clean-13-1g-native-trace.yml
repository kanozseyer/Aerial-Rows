name: Projectivy CLEAN 13.1G - Native Status Bar Trace

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean13-1g-weather-fix
    paths:
      - '.github/clean13_1g/trace-statusbar-parent.sh'
      - '.github/workflows/projectivy-clean-13-1g-native-trace.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Trace CLEAN13 stable native Status Bar UI paths
        run: |
          set -o pipefail
          bash .github/clean13_1g/trace-statusbar-parent.sh | tee /tmp/clean131g-native-trace.txt
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: clean131g-native-statusbar-trace
          path: /tmp/clean131g-native-trace.txt
          if-no-files-found: error
