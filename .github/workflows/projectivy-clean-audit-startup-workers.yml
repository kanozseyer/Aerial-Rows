name: Projectivy Clean Audit - Startup Worker Trace

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-audit-startup-workers.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Collect startup worker implementations
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/p.apk
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/p.apk -o /tmp/pj >/dev/null
          O=/tmp/startup-workers; mkdir -p "$O"
          for cls in s40 ya3 n43; do
            find /tmp/pj -type f -name "$cls.smali" -print -exec cp {} "$O/" \;
          done
          {
            echo '=== s40 refs ==='; grep -Rni -B8 -A25 -E 'Billing|billing|Premium|premium|Lemon|lemon|license|licence|PTApplication;->d|PTApplication;->y|Ljf2;' /tmp/pj/smali*/s40.smali 2>/dev/null || true
            echo '=== ya3 refs ==='; grep -Rni -B8 -A25 -E 'Billing|billing|Premium|premium|Lemon|lemon|license|licence|PTApplication;->d|PTApplication;->y|Ljf2;|Lgq3;->u' /tmp/pj/smali*/ya3.smali 2>/dev/null || true
            echo '=== n43 refs ==='; grep -Rni -B8 -A25 -E 'Billing|billing|Premium|premium|Lemon|lemon|license|licence|PTApplication;->d|PTApplication;->y|Ljf2;' /tmp/pj/smali*/n43.smali 2>/dev/null || true
          } > "$O/references.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-4.72-Startup-Worker-Trace
          path: /tmp/startup-workers/*
          retention-days: 7
