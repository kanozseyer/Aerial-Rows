name: Materialize SAF Backup Save

on:
  push:
    branches: [phase6-final-settings-milestone]
    paths: ['.github/workflows/materialize-saf-backup.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase6-final-settings-milestone
      - name: Patch SAF backup save
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize_saf_backup.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/conreo/couchytv/ui/SettingsSheet.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 6: save configuration through SAF'
          git push origin HEAD:phase6-final-settings-milestone
