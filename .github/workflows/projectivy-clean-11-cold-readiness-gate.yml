name: Projectivy CLEAN 11 - Cold Readiness Gate

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean11-cold-readiness
    paths:
      - '.github/clean07/RedLightDiscoveryProvider.java'
      - '.github/clean11/**'
      - '.github/workflows/projectivy-clean-11-cold-readiness-gate.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 11
        run: bash .github/clean11/build-clean11.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-11-Cold-Readiness-Gate
          path: /tmp/clean11-artifact/
          if-no-files-found: error
