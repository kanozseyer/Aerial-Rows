name: Projectivy CLEAN 12 - Throttled Red Light Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean12-refresh-lifecycle
    paths:
      - '.github/clean07/RedLightDiscoveryProvider.java'
      - '.github/clean12/**'
      - '.github/workflows/projectivy-clean-12-refresh-lifecycle.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 12
        run: bash .github/clean12/build-clean12.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-12-Throttled-RedLight-Refresh
          path: /tmp/clean12-artifact/
          if-no-files-found: error
