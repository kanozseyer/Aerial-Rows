name: Projectivy CLEAN 13.1 - Native UI Trace

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean13-1-weather
    paths:
      - '.github/clean13_1/trace-native-weather-ui.sh'
      - '.github/clean13_1/trace-native-ui-helpers.sh'
      - '.github/workflows/projectivy-clean-13-1-native-ui-trace.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Trace native Projectivy category icon/toggle helpers
        run: bash .github/clean13_1/trace-native-ui-helpers.sh
