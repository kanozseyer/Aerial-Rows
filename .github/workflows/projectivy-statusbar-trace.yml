name: Projectivy Status Bar UI Trace

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clock-trace
    paths:
      - '.github/workflows/projectivy-statusbar-trace.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build frozen CLEAN12.1B APK
        run: bash .github/clean121b/build-clean121b.sh

      - name: Download JADX and apktool
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          curl -L --fail --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Decode layouts and discover native dropdown implementations
        run: |
          set -euo pipefail
          APK=/tmp/Projectivy-CLEAN-12-1B-Description-Normalization-Fix.apk
          JOUT=/tmp/projectivy-jadx
          AOUT=/tmp/projectivy-apktool
          ART=/tmp/statusbar-trace
          rm -rf "$JOUT" "$AOUT" "$ART"
          mkdir -p "$ART/src" "$ART/res"

          /tmp/jadx/bin/jadx --no-res -d "$JOUT" "$APK" >/tmp/jadx-statusbar.log 2>&1 || true
          java -jar /tmp/apktool.jar d -f "$APK" -o "$AOUT" >/tmp/apktool-statusbar.log 2>&1

          cp "$AOUT/res/layout/custom_browse_title_view.xml" "$ART/res/"
          cp "$AOUT/res/values/ids.xml" "$ART/res/" || true
          cp "$AOUT/res/values/strings.xml" "$ART/res/" || true
          cp "$AOUT/res/values/styles.xml" "$ART/res/" || true
          cp "$AOUT/res/values/colors.xml" "$ART/res/" || true
          cp "$AOUT/res/values/dimens.xml" "$ART/res/" || true

          python3 - <<'PY'
          from pathlib import Path
          import shutil, re
          root=Path('/tmp/projectivy-jadx/sources')
          dst=Path('/tmp/statusbar-trace/src')

          exact={'pg.java','cb3.java','w54.java','mu1.java','lu1.java','ev1.java','yh3.java','hj3.java','MainTitleView.java','ClockView.java'}
          copied=set()
          for p in root.rglob('*.java'):
              if p.name in exact:
                  target=dst/(p.parent.name+'__'+p.name)
                  shutil.copy2(p,target); copied.add(str(p))

          # Find settings pages that build choice/list actions, especially ones that
          # persist a preference from a finite option set.
          hits=[]
          for p in root.rglob('*.java'):
              try: text=p.read_text(errors='replace')
              except: continue
              score=0
              needles=['List<String>', 'ab0.J(', 'setCheckedActions', 'GuidedAction', 'mu1', 'lu1', 'q0(', '.h(String.valueOf', 'arrayList.add(cb3.z0']
              for n in needles:
                  if n in text: score += 1
              if 'extends cb3' in text and score >= 4:
                  hits.append((score,p,text))
          hits.sort(key=lambda x:(-x[0],str(x[1])))
          for idx,(score,p,text) in enumerate(hits[:20]):
              target=dst/(f'dropdown_{idx:02d}_{p.parent.name}__{p.name}')
              shutil.copy2(p,target)
              print('DROPDOWN CANDIDATE',score,p)

          # Also save a compact grep report for likely action constructors/helpers.
          report=[]
          for p in root.rglob('*.java'):
              try: lines=p.read_text(errors='replace').splitlines()
              except: continue
              for i,line in enumerate(lines):
                  if any(n in line for n in ['new lu1(', 'new mu1(', 'cb3.t0(', 'q0(hj3.', 'setCheckedActions', 'checkSetId']):
                      report.append(f'FILE {p} LINE {i+1}: {line.strip()}')
          Path('/tmp/statusbar-trace/dropdown-report.txt').write_text('\n'.join(report[:5000]))
          PY

          echo '--- title layout ---'
          cat "$ART/res/custom_browse_title_view.xml"
          echo '--- copied sources ---'
          find "$ART/src" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload status bar trace
        uses: actions/upload-artifact@v4
        with:
          name: Projectivy-StatusBar-UI-Trace
          path: |
            /tmp/statusbar-trace/**
            /tmp/jadx-statusbar.log
            /tmp/apktool-statusbar.log
          if-no-files-found: error
