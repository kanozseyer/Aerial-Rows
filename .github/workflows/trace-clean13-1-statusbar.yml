name: Trace CLEAN13.1 Status Bar Parent

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean13-1-weather
    paths:
      - '.github/clean13_1/trace-statusbar-parent.sh'
      - '.github/workflows/trace-clean13-1-statusbar.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Trace parent Status Bar settings and clock references
        run: bash .github/clean13_1/trace-statusbar-parent.sh
