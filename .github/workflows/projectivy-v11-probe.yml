name: Projectivy v11 Probe

on:
  workflow_dispatch:
  push:
    branches: [projectivy-native-mod]
    paths:
      - '.github/workflows/projectivy-v11-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/projectivy.apk
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          curl -fL --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
      - name: Decode, patch and inspect final smali
        shell: bash
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar d -f /tmp/projectivy.apk -o /tmp/decoded >/dev/null
          python3 .github/projectivy-aerial-integration.py
          python3 .github/projectivy-aerial-enhancements.py
          python3 .github/projectivy-single-apk.py
          python3 .github/projectivy-redlight-routing.py
          python3 .github/projectivy-redlight-label.py
          python3 .github/projectivy-channel-multiselect.py
          mkdir -p /tmp/probe
          G=$(find /tmp/projectivy-decoded -name g70.smali -print -quit)
          K=$(find /tmp/projectivy-decoded -name k00.smali -print -quit)
          cp "$G" /tmp/probe/g70-final.smali
          cp "$K" /tmp/probe/k00-final.smali
          awk '/\.method public final p0\(\)V/{f=1} f{print} f&&/\.end method/{exit}' "$G" > /tmp/probe/g70-p0.smali
          grep -n -C 35 'ChannelSelectionBridge' "$G" > /tmp/probe/multiselect-context.txt || true
      - name: Decompile and trace card background key
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jadx-out
          /tmp/jadx/bin/jadx -d /tmp/jadx-out /tmp/projectivy.apk >/tmp/probe/jadx.log 2>&1 || true
          grep -Rni -C 8 'appearance_cards_bg_tint' /tmp/jadx-out/sources > /tmp/probe/card-bg-hits.txt || true
          grep -Ril 'appearance_cards_bg_tint' /tmp/jadx-out/sources | head -n 40 > /tmp/probe/card-bg-files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            rel="${f#/tmp/jadx-out/sources/}"
            mkdir -p "/tmp/probe/src/$(dirname "$rel")"
            cp "$f" "/tmp/probe/src/$rel"
          done < /tmp/probe/card-bg-files.txt
          grep -RniE 'appearance_cards_bg_tint|cards_bg|put(Int|Long|Float|String)|\.h\(' /tmp/probe/src > /tmp/probe/card-bg-expanded.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-v11-Probe
          path: /tmp/probe
          retention-days: 2
