name: Projectivy Clean Audit - Configure Predicate
on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-audit-configure-predicate.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Configure predicate
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/official.apk
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/official.apk -o /tmp/pj >/dev/null
          mkdir -p /tmp/audit
          sed -n '1340,1538p' /tmp/pj/smali_classes2/ze.smali > /tmp/audit/ze-configure-block.txt
          sed -n '700,755p' /tmp/pj/smali/y05.smali > /tmp/audit/y05-configure-capability.txt
          cat /tmp/audit/ze-configure-block.txt
          cat /tmp/audit/y05-configure-capability.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-Configure-Predicate-Audit
          path: /tmp/audit/*
          retention-days: 7
