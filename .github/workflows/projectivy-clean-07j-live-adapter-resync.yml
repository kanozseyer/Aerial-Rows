name: Projectivy CLEAN 07J - Live Adapter Resync

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean07j-live-adapter-register]
    paths:
      - '.github/workflows/projectivy-clean-07j-live-adapter-resync.yml'
      - '.github/clean07j/**'
      - '.github/clean07f/**'
      - '.github/clean07/**'
      - '.github/clean06/**'
      - '.github/clean05/**'
      - '.github/clean04/**'
      - '.github/clean03/**'
      - '.github/clean02/**'
      - '.github/patch-clean-01k-projectivy-telemetry.py'
      - '.github/patch-clean-01h-external-license.py'
      - '.github/patch-clean-01g-surgical-dex.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 07J
        shell: bash
        run: bash .github/clean07j/build-clean07j.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-07J-Live-Adapter-Resync
          path: /tmp/clean07j-artifact/*
          retention-days: 30
