name: Projectivy CLEAN 08.3 - Native Appearance Apply

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean08-3-native-appearance-apply]
    paths:
      - '.github/workflows/projectivy-clean-08-3-native-appearance.yml'
      - '.github/clean083/**'
      - '.github/clean082/**'
      - '.github/clean081/**'
      - '.github/clean08/**'
      - '.github/clean07l/**'
      - '.github/clean07k/**'
      - '.github/clean07h/**'
      - '.github/clean07f/**'
      - '.github/clean07/**'
      - '.github/clean06/**'
      - '.github/clean05/**'
      - '.github/clean04/**'
      - '.github/clean03/**'
      - '.github/clean02/**'
      - '.github/patch-clean-01k-projectivy-telemetry.py'
      - '.github/patch-clean-01h-external-license.py'
      - '.github/patch-clean-01g-surgical-dex.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 08.3
        shell: bash
        run: bash .github/clean083/build-clean083.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-08-3-Native-Appearance
          path: /tmp/clean083-artifact/*
          retention-days: 30
          if-no-files-found: error
