name: Projectivy Clean Audit - Home Billing Constructor

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-audit-home-billing-constructor.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode and locate s40 selector-2 constructor
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/official.apk
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/official.apk -o /tmp/pj >/dev/null
          mkdir -p /tmp/out
          {
            echo '=== every s40 construction ==='
            grep -R -n -B20 -A30 'Ls40;-><init>(Ljava/lang/Object;Lxi0;B)V' /tmp/pj/smali /tmp/pj/smali_classes2 /tmp/pj/smali_classes3 2>/dev/null || true
            echo
            echo '=== MainFragment references around s40 ==='
            grep -R -n -B30 -A50 -E 'MainFragment.*Ls40|Ls40.*MainFragment|new-instance .*Ls40;' /tmp/pj/smali /tmp/pj/smali_classes2 /tmp/pj/smali_classes3 2>/dev/null || true
          } > /tmp/out/references.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-4.72-Home-Billing-Constructor
          path: /tmp/out/*
          retention-days: 7
