name: Projectivy CLEAN 10 - TV Show Navigation

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean10-tv-navigation]
    paths:
      - '.github/workflows/projectivy-clean-10-tv-show-navigation.yml'
      - '.github/clean10/**'
      - '.github/clean09/**'
      - '.github/clean085/**'
      - '.github/clean082/**'
      - '.github/clean081/**'
      - '.github/clean08/**'
      - '.github/clean07l/**'
      - '.github/clean07k/**'
      - '.github/clean07h/**'
      - '.github/clean07f/**'
      - '.github/clean07/**'
      - '.github/clean06/**'
      - '.github/clean05/**'
      - '.github/clean04/**'
      - '.github/clean03/**'
      - '.github/clean02/**'
      - '.github/patch-clean-01k-projectivy-telemetry.py'
      - '.github/patch-clean-01h-external-license.py'
      - '.github/patch-clean-01g-surgical-dex.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 10
        shell: bash
        run: bash .github/clean10/build-clean10.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-10-TV-Show-Navigation
          path: /tmp/clean10-artifact/*
          retention-days: 30
          if-no-files-found: error
