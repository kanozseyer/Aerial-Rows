name: Projectivy CLEAN 11.1 - Kodi Retention Lease

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean11-1-kodi-retention-lease
    paths:
      - '.github/clean07/RedLightDiscoveryProvider.java'
      - '.github/clean111/**'
      - '.github/workflows/projectivy-clean-11-1-kodi-retention-lease.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 11.1
        run: bash .github/clean111/build-clean111.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-11-1-Kodi-Retention-Lease
          path: /tmp/clean111-artifact/
          if-no-files-found: error
