name: Projectivy Edit Channels Probe

on:
  workflow_dispatch:
  push:
    branches: [projectivy-native-mod]
    paths:
      - '.github/workflows/projectivy-edit-channels-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Projectivy and JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/projectivy.apk
          curl -fL --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
      - name: Decompile and collect channel-selection classes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jadx-out /tmp/probe
          mkdir -p /tmp/jadx-out /tmp/probe
          /tmp/jadx/bin/jadx -d /tmp/jadx-out /tmp/projectivy.apk >/tmp/jadx.log 2>&1 || true
          cp /tmp/jadx.log /tmp/probe/
          for cls in k00 b40 g70 w40 i5 m60 ft f6 f70 r10 h5 ie2 he2 ge2 u40 t40; do
            f="/tmp/jadx-out/sources/defpackage/${cls}.java"
            [ -f "$f" ] && cp "$f" "/tmp/probe/${cls}.java"
          done
          find /tmp/jadx-out/sources -type f -name '*.java' -print0 | xargs -0 grep -ilE 'ManageChannelsActivity|prefs_channels|settings_channels|action_visibility|MultiSelectListPreference|ListPreference|setChecked|isChecked|new ft\(|class ft|class f6|class f70' | head -n 140 > /tmp/probe/hit-files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            rel="${f#/tmp/jadx-out/sources/}"
            mkdir -p "/tmp/probe/src/$(dirname "$rel")"
            cp "$f" "/tmp/probe/src/$rel"
          done < /tmp/probe/hit-files.txt
          grep -RniE 'ManageChannelsActivity|prefs_channels|settings_channels|action_visibility|MultiSelectListPreference|ListPreference|setChecked|isChecked|new ft\(|class ft|class f6|class f70|\.n =|\.n\)' /tmp/probe/src /tmp/probe/*.java > /tmp/probe/hits.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-Edit-Channels-Probe
          path: /tmp/probe
          retention-days: 2
