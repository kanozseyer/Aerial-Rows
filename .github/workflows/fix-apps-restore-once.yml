name: Fix Apps Restore Once

on:
  push:
    branches: [phase6-final-settings-milestone]
    paths: ['.github/workflows/fix-apps-restore-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase6-final-settings-milestone
      - name: Patch Apps restore behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_apps_restore_once.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/conreo/couchytv/ui/SettingsSheet.kt
          git commit -m 'Fix Apps settings restore to run only on entry'
          git push origin HEAD:phase6-final-settings-milestone
