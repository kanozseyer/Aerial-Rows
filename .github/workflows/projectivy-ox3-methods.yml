name: Projectivy 4.72 ox3 Paint Methods

on:
  push:
    branches: [projectivy-liquid-glass]
    paths: ['.github/workflows/projectivy-ox3-methods.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract exact dock paint method bytecode
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/ox3-methods"
          mkdir -p "$W" && cd "$W"
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o p.apk
          echo 'a312935837b7cf323880455c322f4c98060e3e37e8c6187963fb2c4764534aae  p.apk' | sha256sum -c -
          URL="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n1)"
          curl -fL --retry 3 "$URL" -o apktool.jar
          java -jar apktool.jar d -f -r p.apk -o decoded >/dev/null 2>&1
          OX3="$(find decoded -type f -name ox3.smali -print -quit)"
          test -n "$OX3"
          python3 - "$OX3" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          lines=p.read_text().splitlines()
          wanted=['.method public constructor <init>(IFFF)V','.method public final e(I)V']
          out=[]
          for sig in wanted:
              start=next(i for i,l in enumerate(lines) if l.strip()==sig)
              end=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='.end method')
              out.append(f'=== {sig} ===')
              out.extend(f'{i+1:5}: {lines[i]}' for i in range(start,end+1))
              out.append('')
          Path('ox3-methods.txt').write_text('\n'.join(out))
          PY
          cat ox3-methods.txt
      - uses: actions/upload-artifact@v4
        with:
          name: projectivy-4.72-ox3-methods
          path: ${{ runner.temp }}/ox3-methods/ox3-methods.txt
          retention-days: 3
