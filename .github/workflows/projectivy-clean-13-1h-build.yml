name: Projectivy CLEAN 13.1H - Weather Controls and Order

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean13-1h-weather-controls-order
    paths:
      - '.github/clean13_1h/**'
      - '.github/workflows/projectivy-clean-13-1h-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CLEAN13.1H
        shell: bash
        run: bash .github/clean13_1h/build-clean13-1h.sh

      - name: Upload CLEAN13.1H artifact
        uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-13-1H-Weather-Controls-Order
          path: /tmp/clean13-1h-artifact/*
          if-no-files-found: error
