name: Projectivy CLEAN 10.3 - Sanitized TV Browse URI

on:
  workflow_dispatch:
  push:
    branches:
      - projectivy-clean10-3-sanitized-browse-uri
    paths:
      - '.github/clean103/**'
      - '.github/workflows/projectivy-clean-10-3-sanitized-tv-browse-uri.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify CLEAN 10.3
        run: bash .github/clean103/build-clean103.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-CLEAN-10-3-Sanitized-TV-Browse-URI
          path: /tmp/clean103-artifact/
          if-no-files-found: error
