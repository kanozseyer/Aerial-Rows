name: Projectivy Clean Audit - Billing Caller Trace

on:
  workflow_dispatch:
  push:
    branches: [projectivy-clean-rebuild-472]
    paths:
      - '.github/workflows/projectivy-clean-audit-billing-caller.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode and trace BillingClient construction
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/spocky/miproja1/releases/download/4.72/ProjectivyLauncher-4.72-c97-xda-release.apk' -o /tmp/official.apk
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f /tmp/official.apk -o /tmp/pj >/dev/null
          mkdir -p /tmp/out
          cp /tmp/pj/smali/qw.smali /tmp/out/qw.smali
          {
            echo '=== Lqw construction/calls ==='
            grep -R -n -B8 -A16 -E 'new-instance .*Lqw;|invoke-(direct|virtual|static|interface).*Lqw;|sget-object .*Lqw;' /tmp/pj/smali /tmp/pj/smali_classes2 /tmp/pj/smali_classes3 2>/dev/null || true
            echo
            echo '=== InAppBillingService bind string context ==='
            grep -n -B80 -A120 'com.android.vending.billing.InAppBillingService.BIND' /tmp/pj/smali/qw.smali || true
            echo
            echo '=== BillingClient API construction references outside billing library ==='
            grep -R -n -B10 -A20 -E 'BillingClient|Lcom/android/billingclient/api/|com.android.vending.billing.InAppBillingService.BIND' /tmp/pj/smali /tmp/pj/smali_classes2 /tmp/pj/smali_classes3 2>/dev/null | grep -v '/com/android/billingclient/' || true
          } > /tmp/out/references.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Projectivy-4.72-Billing-Caller-Trace
          path: /tmp/out/*
          retention-days: 7
